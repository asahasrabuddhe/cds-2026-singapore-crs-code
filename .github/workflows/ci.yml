name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nothing here writes back to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "$out"
            exit 1
          fi
      - name: go vet, both build tags
        run: |
          go vet ./...
          go vet -tags integration ./...
      - name: shellcheck
        run: shellcheck scripts/*.sh

  # The pure packages, on the two operating systems people write this on.
  # Everything that touches the kernel is build-tagged linux and only
  # compiled here; the macOS job proves the split is honest.
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - run: go build ./...
      - run: go test ./...

  # Real containers, as root, on the runner's own kernel. The runner is
  # Ubuntu on cgroup v2, the same shape as the workshop VM once it has the
  # one sysctl that provision/user-data.yaml writes.
  test-root:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - name: allow user namespaces, as provision/user-data.yaml does
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: pre-flight
        run: ./scripts/check.sh
      - name: integration tests
        run: make test-root
