name: CI

on:
  pull_request:
  push:
    branches: [main, final]

# Nothing here writes back to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "$out"
            exit 1
          fi
      - name: go vet, both build tags
        run: |
          go vet ./...
          go vet -tags integration ./...
      - name: shellcheck
        run: shellcheck scripts/*.sh

  # final is the finished runtime and every test passes. main is the
  # workshop, with five bodies stubbed, and exactly the six packages the
  # steps cover fail: any other result means scripts/stub.py and the tests have
  # drifted apart.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - run: go build ./...
      - name: go test, all green on final
        if: ${{ (github.base_ref || github.ref_name) != 'main' }}
        run: go test ./...
      - name: go test, the six step packages fail on main
        if: ${{ (github.base_ref || github.ref_name) == 'main' }}
        run: |
          got="$(go test ./... 2>&1 | awk '/^FAIL\t/ {print $2}' | sort | tr '\n' ' ')"
          want="go.ajitem.com/cds-crs/internal/caps go.ajitem.com/cds-crs/internal/cgroup go.ajitem.com/cds-crs/internal/cli go.ajitem.com/cds-crs/internal/initproc go.ajitem.com/cds-crs/internal/namespace go.ajitem.com/cds-crs/internal/rootfs "
          if [ "$got" != "$want" ]; then
            echo "failing: $got"
            echo "want:    $want"
            exit 1
          fi

  # Real containers, as root, on the runner's own kernel. The runner is
  # Ubuntu on cgroup v2, the same shape as the workshop VM once it has the
  # one sysctl that provision/user-data.yaml writes.
  test-root:
    if: ${{ (github.base_ref || github.ref_name) != 'main' }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - name: allow user namespaces, as provision/user-data.yaml does
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: pre-flight
        run: ./scripts/check.sh
      - name: integration tests
        run: make test-root
